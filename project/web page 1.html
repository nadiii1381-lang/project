<DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <title>Coffee Menu</title>
            <style>
                *{margin: 0%;padding: 0;box-sizing: border-box;font-family:'poppins',sans-serif;}
                body{
                    font-family: Arial;
                    background:#f3e6dc;
                    color: #2b1a12;
                    margin: 0;
                }
               
                
                header{
                    background: #fffdd0;
                    color: black;
                    padding: 15px;
                    text-align: right;
                }
                header a{
                    color:black;
                    text-decoration: none;
                    margin-left: 20px;
                    text-align: left;
                }
                .menu{
                    display: flex;
                    gap: 20px;
                    background: white;
                    margin: 20px;
                    padding: 15px;
                    border-radius: 10px;
                }
                .banner{
                    height: 260px;
                    background: linear-gradient(rgba(0, 0 ,0 ,.4), rgba(0, 0 ,0 ,.4)) ,url('https://th.bing.com/th/id/OIF.KP6CbzHNIECp1pMLdq6DTw?w=294&h=172&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3') center/cover no-repeat;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: #fff;
                    text-align: center;

                }
                .item{
                    background: #fff;
                    border-radius: 18px;
                    overflow: hidden;
                    box-shadow: 0 10px 25px rgba(0,0,0,.4);
                    width: 100%;
                    height: 350px;
                }
                .item img{
                    width: 100%;
                    height: 200px;
                    object-fit: cover;
                }
                .item div{
                    padding: 20px;
                
                }
                .item h3{
                    text-align: center;
                    margin-bottom: 8px;
                }
                .item button{
                    border: none;
                    background: #2b1a12;
                    color: #fff;
                    padding: 10px 20px;
                    border-radius: 20px;
                    cursor: pointer;
                }

                footer{
                    background: #4b2e21;
                    color:#ccc;
                    text-align: center;
                    padding: 30px;
                    margin-top: 60pxpx;
                }</style>
        </head>
        <body>
            <header>
                <h2><center>Coffee</center></h2>
                <nav>
                    <a href="#">Home</a>
                    <a href="#">Menu</a>
                    <a href="#">Contact</a>
                </nav>
                </header>
                <div class="banner">
                    <div>
                    <h1>OUR MENU</h1>
                    <p>Choose your favorite drink</p>
                    </div>
                </div>
                <section>
                    <h2>COFFEE & SHAKES</h2>
                    <div class="menu">
                        <div class="item">
                            <img src="https://th.bing.com/th/id/OIP.nDc6NWdvisYHzg-a8RYpUAHaEJ?w=279&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3">
                            <div>
                                <h3>Espersso</h3>
                                <p class="price">100AFN</p>
                                <button>Buy</button>
                            </div>
                        </div>
                        <div class="item">
                            <img src="https://th.bing.com/th/id/OIP.UXdfZLTTGL42HOS4vEWFLwHaHa?w=157&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3">
                            <div>
                                <h3>Latte Coffee</h3>
                                <p class="price">150 AFN</p>
                                <button>Buy</button>
                            </div>
                        </div>
                        <div class="item">
                            <img src="https://img.freepik.com/free-photo/freshly-brewed-coffee-dark-cup-wooden-table-generated-by-artificial-intelligence_188544-150660.jpg">
                            <div>
                                <h3>Mocha</h3>
                                <p class="price">200AFN</p>
                                <button>Buy</button>
                            </div>
                        </div>
                        <div class="item">
                            <img src="https://th.bing.com/th/id/OIP.sE_dwk_vY1WyQKYnQg57NQHaEK?w=296&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3">
                            <div>
                            <h3>Chocolate Milkshake</h3>
                            <p class="price">260 AFN</p>
                            <button>Buy</button>
                            </div>
                        </div>
                    </div>
                </section>
                <footer>
                    <p> 2026 Black Coffee | All Rights Reserved</p><br />
                    <p>Nadia Habibi</p>
                </footer>
                </body></html>
