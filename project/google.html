<DOCYPE html>
    <html lang="fa" dir="rtl">
        <head>
            <meta charset="utf-8"/>
            <title>Google</title>
        </head>
        <style>
            html,body{
                height: 100%;
            }
            body{
                margin: 0;
                background: #ffffff;
                color: #202124;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
            }
            header{
                height: 60px;
                padding: 0 50px;
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 14px;
                font-size: 14px;
            }
            header a{
                color: #202124;
                text-decoration: none;
                padding: 6px 6px;
                border-radius: 6px;

            }
            header a:hover{
                text-decoration: underline;
            }
            input {
                width: 100%;
                height:40px;
                padding: 0 44px 0 44px;
                border: 1px solid #dfe1e5;
                border-radius:100px;
                outline: none;
                direction: rtl;
                
            }
             input[type="search"]:hover,
             fieldset:focus-within input[type="search"]{
             box-shadow:0 1px 6px rgba(32,33,36,.28);
            border-color:transparent;
             }
             fieldset {
                border: 0;
                padding: 0;
                margin: 0;
             }
            main{
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0 16px 80px;
            }
            section{
                width: min(600px 100%);
                text-align: center;
            }
            h1{
                margin: 200px 0 26px;
                font-size: 92px;
                line-height: 1;
                font-weight: 700;
                letter-spacing: 2px;
                user-select: none;
            
            }
            h1 span{display: inline-block;}
            h1 .a{color: #4285f4;}
            h1 .b{color: #ea4335;}
            h1 .c{color: #fbbc05;}
            h1 .d{color:#4285f4;}
            h1 .e{color: #34a853;}
            h1 .f{color: #ea4335;}
            footer{
                background: #f2f2f2;
                color: #5f6368;
                font-size: 14px;
            }
            footer section{
                padding: 12px 16px;
                border-top: 1px solid #dfe1e5;
                text-align: right;
            }
            footer a{
                 color: #202124;
                text-decoration: none;
                padding: 6px 6px;
                border-radius: 6px;

            }
            menu{
                list-style: none;
                padding: 18px 0 0;
                display: flex;
                justify-content: center;
                gap: 30px;
                
            }
        
        </style>
        <body>
            <header>
                <a href="https://mail.google.com/mail/&ogbl">Gmail</a>
                <a href="https://www.google.com.eg/imghp?hl=ps&ogbl">تصاویر</a>
            </header>
            <main>
                <section aria-label="صفحه اصلی">
                    <h1 aria-label="Google" dir="ltr">
                    <span class="a">G</span>
                    <span class="b">o</span>
                    <span class="c">o</span>
                    <span class="d">g</span>
                    <span class="e">l</span>
                    <span class="f">e</span>
                    </h1>
                    <form action="https://www.google.com/" method="get" role="search" aria-label="جستجو">
                        <fieldset>
                            <label for="q">جستجو</label>
                        
                            <button class="searchIcon" type="submit" aria-label="search" title="search">
                                <svg width="16" height="16">
                                     <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20 21.49 21.49 20 15.5 14ZM9.5 14A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/>
                                </svg>
                            </button>
                            <input id="q" name="q" type="search" autocomplete="off"/>
                        </fieldset>
                        <menu aria-label="دکمه ها">
                            <li><button type="submit">جستجو Google</button></li>
                            <li><button type="submit" name="btni" value="1">حالم خوشه</button></li>
                            </menu>
                    </form>
                </section>
            </main>
            <footer>
                <section>افغانستان</section>
                <section> <a href="https://www.google.com/#:~:text=%D8%B4%D8%B1%D8%A7%DB%8C%D8%B7-,%D8%AA%D9%86%D8%B8%DB%8C%D9%85%D8%A7%D8%AA,-%D8%AA%D9%86%D8%B8%DB%8C%D9%85%D8%A7%D8%AA%20%C2%AB%D8%AC%D8%B3%D8%AA%D8%AC%D9%88%C2%BB">تنظیمات</a>
            <a href="https://policies.google.com/terms?hl=fa-AF&fg=1">شرایط</a>
            <a href="https://policies.google.com/privacy?hl=fa-AF&fg=1">حریم خصوصی</a>
            <a href="https://google.com/search/howsearchworks/?fg=1">نحوه عملکرد جستجو</a>
            <a href="https://www.google.com/services/?subid=ww-ww-et-g-awa-a-g_hpbfoot1_1!o2&utm_source=google.com&utm_medium=referral&utm_campaign=google_hpbfooter&fg=1">تجارت</a>
            <a href="https://www.google.com/intl/fa_af/ads/?subid=ww-ww-et-g-awa-a-g_hpafoot1_1!o2&utm_source=google.com&utm_medium=referral&utm_campaign=google_hpafooter&fg=1">تبلیغ</a>
            <a href="https://about.google/?utm_source=google-AF&utm_medium=referral&utm_campaign=hp-footer&fg=1">درباره</a></section>
            </footer>
            </body>
            </html>
